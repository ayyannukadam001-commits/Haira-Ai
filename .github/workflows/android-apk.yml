name: Build HAIRA Android APK
on:
  push:
    branches: [ "main", "feature/haira-part1-core-v0.6.0", "feature/haira-part2-workstation-v0.7.0", "feature/haira-part3-self-setup-v0.8.0", "feature/haira-part4-task-engine-v0.9.0", "feature/haira-part5-bundled-model-v1.0.0" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
concurrency:
  group: haira-android-apk-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.6"
      - name: Download and verify bundled Qwen3 model
        run: |
          mkdir -p app/src/main/assets/models
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/litert-community/Qwen3-0.6B/resolve/main/Qwen3-0.6B.litertlm" \
            --output app/src/main/assets/models/Qwen3-0.6B.litertlm
          echo "c5f39b4191926786c3e6668b62af4d6eb15248dfc7a5348252a9b406f33f2108  app/src/main/assets/models/Qwen3-0.6B.litertlm" | sha256sum --check
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: HAIRA-debug-APK-v1.0.0-Part5
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
